name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  queue: max
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
          architecture: x64
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          architecture: x64
          package-manager-cache: false
      - name: Install dependencies
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements-build.txt'
      - name: Prepare verified FFmpeg
        run: python prepare_ffmpeg.py
      - name: Test
        run: python -m unittest -v
      - name: Build application
        run: python build_exe.py $env:VERSION
      - name: Package ZIP and installer
        run: |
          Compress-Archive -Path dist/YouTubeDownloader -DestinationPath "dist/YouTubeDownloader-$env:VERSION-windows-x64.zip"
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" "/DAppVersion=$env:VERSION" installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Verify distribution
        run: ./test_distribution.ps1 -Version $env:VERSION
      - name: Save verified release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          if-no-files-found: error
          path: |
            dist/*-windows-x64.zip
            dist/*-windows-x64-setup.exe
            dist/YouTubeDownloader/DEPENDENCIES.json
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: release-files
      - name: Publish Release
        env:
          VERSION: 0.1.${{ github.run_number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v$VERSION" release-files/*-windows-x64.zip release-files/*-windows-x64-setup.exe release-files/YouTubeDownloader/DEPENDENCIES.json --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
